name: Publish to GitHub Pages branch

# GitHub Pages serves /docs from SITE_BRANCH. On every push to main this
# workflow rebuilds the MVP, writes it and app/ into docs/ on that branch and pushes.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

env:
  # Must match Settings → Pages (only the repo owner can change that setting).
  SITE_BRANCH: claude/funny-edison-whtbw7

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SITE_BRANCH }}
          path: site

      - name: Build docs/ in the site branch
        run: |
          set -euo pipefail
          # Pages serves only /docs: drop everything else (old prototype files stay in git history)
          find site -mindepth 1 -maxdepth 1 ! -name docs ! -name .git -exec rm -rf {} +
          rm -rf site/docs; mkdir -p site/docs/mvp site/docs/app
          cp -r dist/. site/docs/
          cp -r dist/. site/docs/mvp/   # old links to /mvp/
          cp -r app/index.html app/src app/packs site/docs/app/
          touch site/docs/.nojekyll

      - name: Commit and push
        id: push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish from main ${GITHUB_SHA::7}"
          git push origin "HEAD:${SITE_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
